<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --ink:#1a1a1a;
    --ink-2:#555;
    --ink-3:#999;
    --line:#e8eaed;
    --accent:#52c41a;
    --accent-bg:#f6ffed;
    --accent-border:#b7eb8f;
    --shadow:0 1px 3px rgba(0,0,0,.04);
    --shadow-hover:0 4px 16px rgba(0,0,0,.08);
    --serif:"Noto Serif SC",serif;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--bg);
    line-height:1.6;-webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  a{text-decoration:none;color:inherit}
  ::selection{background:rgba(82,196,26,.15)}

  /* ===== 容器 ===== */
  .wrap{
    max-width:1200px;margin:0 auto;
    padding:40px 24px 80px;
  }

  /* ===== 顶部标题区 ===== */
  .page-title{
    font-size:32px;font-weight:900;letter-spacing:-.5px;
    color:var(--ink);line-height:1.2;
    font-family:var(--serif);
  }
  .page-subtitle{
    margin-top:6px;font-size:14px;color:#888;
    font-weight:400;
  }

  /* ===== 工具栏：搜索 + 分类按钮 ===== */
  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;margin-top:24px;flex-wrap:wrap;
  }
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:0 14px;height:38px;width:280px;max-width:100%;
    transition:.15s;
  }
  .search-box:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(82,196,26,.1);
  }
  .search-box svg{width:15px;height:15px;fill:none;stroke:#aaa;stroke-width:2;flex-shrink:0}
  .search-box input{
    flex:1;border:none;outline:none;background:transparent;
    font-size:13.5px;font-family:var(--sans);color:var(--ink);
  }
  .search-box input::placeholder{color:#bbb}

  .filter-group{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .filter-btn{
    padding:0 16px;height:36px;border-radius:18px;
    background:#fff;border:1px solid var(--line);
    font-size:13px;font-weight:500;color:var(--ink-2);
    cursor:pointer;transition:.15s;
    font-family:var(--sans);white-space:nowrap;
  }
  .filter-btn:hover{border-color:#d0d0d0;color:var(--ink)}
  .filter-btn.active{
    background:var(--accent-bg);border-color:var(--accent-border);
    color:var(--accent);
  }

  /* ===== 分类区块 ===== */
  .section{margin-top:40px}
  .cat-title{
    display:flex;align-items:center;gap:8px;
    font-size:18px;font-weight:700;color:var(--ink);
    margin-bottom:16px;
  }
  .cat-title svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}

  /* ===== 卡片网格：4列 ===== */
  .card-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  }
  .site-card{
    background:var(--card);border-radius:14px;
    padding:16px;
    border:1px solid var(--line);
    transition:.18s;cursor:pointer;
    display:flex;align-items:flex-start;gap:12px;
    box-shadow:var(--shadow);
  }
  .site-card:hover{
    box-shadow:var(--shadow-hover);
    border-color:#d6e8d0;
    transform:translateY(-1px);
  }
  .site-card:hover .name{color:var(--accent)}
  .site-card .icon{
    width:44px;height:44px;border-radius:10px;
    background:#f5f5f5;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .site-card .icon svg{
    width:24px;height:24px;
    fill:none;stroke:var(--ink-3);stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .site-card .info{
    flex:1;min-width:0;
    display:flex;flex-direction:column;gap:3px;
  }
  .site-card .name{
    font-size:14.5px;font-weight:700;color:var(--ink);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .site-card .desc{
    font-size:12px;color:var(--ink-3);
    line-height:1.5;font-weight:300;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ===== 专辑时间线 ===== */
  .timeline-section{margin-top:48px}
  .timeline{
    position:relative;
    padding:60px 0 60px;
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    margin-top:16px;
  }
  .timeline-inner{position:relative;padding:0 4%;}
  /* 中间横线 */
  .timeline-line{
    position:absolute;left:4%;right:4%;top:50%;
    height:1px;background:var(--line);
  }
  .tl-row{
    position:relative;
    display:grid;grid-template-columns:repeat(9,1fr);
    align-items:start;
  }
  .tl-row.row-top{margin-bottom:0}
  .tl-row.row-bottom{margin-top:0}
  /* 圆点 */
  .tl-dots{
    position:absolute;left:4%;right:4%;top:50%;
    display:grid;grid-template-columns:repeat(9,1fr);
    transform:translateY(-50%);
    pointer-events:none;
  }
  .tl-dots span{
    width:10px;height:10px;border-radius:50%;
    background:#333;
    justify-self:center;
    box-shadow:0 0 0 4px var(--card);
  }
  /* 每个专辑单元 */
  .tl-item{
    position:relative;
    display:flex;flex-direction:column;
    align-items:center;
  }
  .tl-item .yr{
    font-size:12px;color:var(--ink-3);font-weight:400;
  }
  .tl-item .nm{
    font-size:15px;font-weight:700;color:var(--ink);
    white-space:nowrap;
    margin-top:2px;
  }
  .tl-row.row-top .tl-item{
    padding-bottom:40px;
    justify-content:flex-end;
  }
  .tl-row.row-bottom .tl-item{
    padding-top:40px;
    justify-content:flex-start;
  }
  .tl-item .alb-card{cursor:pointer;transition:.15s;text-align:center}
  .tl-item .alb-card:hover .nm{color:var(--accent)}

  /* ===== 关于 / 底部 ===== */
  .about-row{
    margin-top:60px;padding-top:24px;
    border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;
    font-size:12.5px;color:var(--ink-3);
  }
  .about-row b{color:var(--ink-2);font-weight:500}
  .about-row b a{text-decoration:none;color:inherit;border-bottom:1px solid transparent;transition:.15s}
  .about-row b a:hover{border-bottom-color:var(--ink-2)}

  /* ===== 弹层 ===== */
  .modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.on{display:flex}
  .modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
  .modal-box{
    position:relative;width:100%;max-width:500px;background:#fff;
    border-radius:14px;padding:36px 32px;
    box-shadow:0 24px 60px rgba(0,0,0,.18);
    animation:pop .24s ease;
    border:1px solid var(--line);
  }
  @keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .modal-box .yr{
    color:var(--ink-3);font-family:var(--serif);font-weight:700;
    font-size:13px;letter-spacing:2px;
  }
  .modal-box h3{
    font-family:var(--serif);font-size:26px;margin:8px 0 14px;color:var(--ink);
  }
  .modal-box .desc{
    color:var(--ink-2);font-weight:300;line-height:1.9;font-size:14.5px;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;
    border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-3);
    font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .modal-close:hover{background:#f5f5f5;color:var(--ink)}

  /* ===== 移动端 ===== */
  @media (max-width:900px){
    .wrap{padding:28px 16px 60px}
    .page-title{font-size:26px}
    .toolbar{flex-direction:column;align-items:stretch}
    .search-box{width:100%}
    .filter-group{justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
    .card-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .timeline{padding:40px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .timeline-inner{min-width:800px}
    .about-row{flex-direction:column;align-items:flex-start}
    .site-card{padding:12px;gap:10px}
    .site-card .icon{width:38px;height:38px}
    .site-card .icon svg{width:20px;height:20px}
    .site-card .name{font-size:13.5px}
    .site-card .desc{font-size:11.5px}
  }
  @media (max-width:500px){
    .card-grid{grid-template-columns:1fr}
    .page-title{font-size:22px}
  }
</style>
</head>

function iconHtml(key){
  const fallback = '<circle cx="12" cy="12" r="9"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[key]||fallback)+'</svg>';
}

function cardHtml(l){
  return `
  <a class="site-card" href="${l.url}" target="_blank" rel="noopener">
    <div class="icon">${iconHtml(l.icon)}</div>
    <div class="info">
      <div class="name">${l.name}</div>
      <div class="desc">${l.desc}</div>
    </div>
  </a>`;
}

const topAlbs = ALBUMS.filter((_,i)=>i%2===0);
const bottomAlbs = ALBUMS.filter((_,i)=>i%2===1);

function tlTopCol(i){return (i*2)+1;}
function tlBottomCol(i){return (i*2)+2;}

function renderTopItem(a,i,absIdx){
  const col = tlTopCol(i);
  return `
    <div class="tl-item" style="grid-column:${col}">
      <div class="alb-card" data-i="${absIdx}">
        <div class="yr">${a.yr}</div>
        <div class="nm">${a.name}</div>
      </div>
    </div>`;
}

function renderBottomItem(a,i,absIdx){
  const col = tlBottomCol(i);
  return `
    <div class="tl-item" style="grid-column:${col}">
      <div class="alb-card" data-i="${absIdx}">
        <div class="nm">${a.name}</div>
        <div class="yr">${a.yr}</div>
      </div>
    </div>`;
}

$("#tlTop").innerHTML = topAlbs.map((a,i)=>renderTopItem(a,i,i*2)).join("");
$("#tlBottom").innerHTML = bottomAlbs.map((a,i)=>renderBottomItem(a,i,i*2+1)).join("");

/* 专辑弹层 */
const modal = $("#albumModal");
function openModal(i){
  const a = ALBUMS[i];
  $("#mYr").textContent = a.yr;
  $("#mName").textContent = a.name;
  $("#mDesc").textContent = a.desc;
  modal.classList.add("on");
}
document.addEventListener("click",e=>{
  const card = e.target.closest(".alb-card");
  if(card) openModal(+card.dataset.i);
});
$("#modalClose").addEventListener("click",()=>modal.classList.remove("on"));
$("#modalMask").addEventListener("click",()=>modal.classList.remove("on"));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") modal.classList.remove("on"); });

/* 随机大标题歌词 */
function getRandomLyric(){
  const total = LYRICS.length;
  let used = [];
  try{
    const raw = localStorage.getItem("lyric_used");
    if(raw) used = JSON.parse(raw);
  }catch(e){ used = []; }
  if(used.length >= total){ used = []; }
  let idx;
  const available = [];
  for(let i=0;i<total;i++){
    if(!used.includes(i)) available.push(i);
  }
  idx = available[Math.floor(Math.random()*available.length)];
  used.push(idx);
  try{
    localStorage.setItem("lyric_used", JSON.stringify(used));
  }catch(e){}
  return LYRICS[idx];
}
$("#pageTitle").textContent = getRandomLyric();
document.title = "山水之间-嵩鼠导航站";

/* ===== 分类筛选 ===== */
const filterBtns = document.querySelectorAll(".filter-btn");
const catSections = document.querySelectorAll(".cat-section");

filterBtns.forEach(btn=>{
  btn.addEventListener("click",()=>{
    filterBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const filter = btn.dataset.filter;
    catSections.forEach(sec=>{
      if(filter==="all" || sec.dataset.cat===filter){
        sec.style.display = "";
      } else {
        sec.style.display = "none";
      }
    });
  });
});

/* ===== 搜索过滤 ===== */
const searchInput = $("#searchInput");
searchInput.addEventListener("input",()=>{
  const q = searchInput.value.trim().toLowerCase();
  const cards = document.querySelectorAll(".site-card");
  cards.forEach(card=>{
    const name = card.querySelector(".name").textContent.toLowerCase();
    const desc = card.querySelector(".desc").textContent.toLowerCase();
    if(!q || name.includes(q) || desc.includes(q)){
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
  });
  /* 搜索时隐藏空区块 */
  catSections.forEach(sec=>{
    if(sec.dataset.cat==="albums") return;
    const visibleCards = sec.querySelectorAll(".site-card:not([style*='display: none'])");
    sec.style.display = visibleCards.length ? "" : "none";
  });
});
